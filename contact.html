<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>צור קשר</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <header>
            <div class="nav-container">
                <div class="delegation-logo">
                    <img src="image/מאני טיים- לוגו.png" alt="לוגו מאני טיים" />
                </div>
                <!-- כפתור המבורגר למובייל -->
                <button class="mobile-menu-toggle">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <nav class="nav-menu">
                    <ul>
                        <li><a href="index.html">ראשי</a></li>
                        <li><a href="schedule.html">לו"ז משלחת</a></li>
                        <li><a href="learning.html">למידה מקדימה</a></li>
                        <li><a href="technical.html">מידע טכני</a></li>
                        <li><a href="recommendations.html">מפה</a></li>
                    </ul>
                </nav>
            </div>
    </header>
    <main>
        <section class="card">
            <h2>צור קשר</h2>
            <p>פרטי יצירת קשר עם מנהלי המשלחת.</p>
        </section>
    </main>
    <footer>
        <div class="footer-content">
            <div class="footer-section">
                כל הזכויות שמורות לארגון מעוז &copy; 2025
            </div>
            <div class="footer-section">
                האתר נבנה ע"י Dor Aloni Sinai
            </div>
            <div class="footer-section">
                <a href="privacy.html">מדיניות פרטיות</a>
            </div>
        </div>
    </footer>
    
    <script>
        // תפריט המבורגר
        document.addEventListener('DOMContentLoaded', function() {
            const mobileMenuToggle = document.querySelector('.mobile-menu-toggle');
            const navMenu = document.querySelector('.nav-menu');
            
            mobileMenuToggle.addEventListener('click', function() {
                mobileMenuToggle.classList.toggle('active');
                navMenu.classList.toggle('active');
            });
            
            // סגירת התפריט בלחיצה על קישור
            const navLinks = document.querySelectorAll('.nav-menu a');
            navLinks.forEach(link => {
                link.addEventListener('click', function() {
                    mobileMenuToggle.classList.remove('active');
                    navMenu.classList.remove('active');
                });
            });
        });
    </script>
</body>
</html>
